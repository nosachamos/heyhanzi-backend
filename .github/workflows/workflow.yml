name: Master CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make env dev-requirements
      - run: make ci-core
