app = "heyhanzi-backend"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
APP_ENV = "PROD"
PORT = "8000"
HEYHANZI_DISABLE_DOTENV = "true"
HEYHANZI_DB_POOL_SIZE = "2"
HEYHANZI_DB_MAX_OVERFLOW = "1"
LOG_LEVEL = "INFO"
PGSSLROOTCERT = "/etc/ssl/certs/ca-certificates.crt"

[processes]
app = "python run.py"

[deploy]
strategy = "rolling"
release_command = "python scripts/migrate_release.py"
release_command_timeout = "5m"

[deploy.release_command_vm]
size = "shared-cpu-1x"
memory = "768mb"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "768mb"
processes = ["app"]

[http_service]
internal_port = 8000
force_https = true
# Keep the single measured-budget machine awake for transactional email retries.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 20
hard_limit = 30

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
path = "/ready"
timeout = "5s"
